
name: Build Gallery APK

on:
  push:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract exact project ZIP
        shell: bash
        run: |
          set -e
          ZIP="Gallery-0.05-project.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found in repository root."
            echo "Files in repository:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          rm -rf project
          mkdir -p project
          unzip -oq "$ZIP" -d project

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e
          SETTINGS=$(find project -maxdepth 8 -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found inside ZIP."
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Building project in: $PROJECT_DIR"

      - name: Show app version
        shell: bash
        run: |
          echo "Checking app version configuration:"
          grep -R -n -E 'versionName|versionCode|applicationId' \
            "${{ steps.project.outputs.dir }}/app/build.gradle.kts" || true

      - name: Build APK
        run: gradle -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          APK=$(find project -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/Gallery-0.05.apk
          ls -lh output/Gallery-0.05.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-0.05-APK
          path: output/Gallery-0.05.apk
          if-no-files-found: error
