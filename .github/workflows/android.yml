name: Android CI

on:
push:
branches: [main, master]
pull_request:
branches: [main, master]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Find Gradle Wrapper
    id: locate
    shell: bash
    run: |
      echo "Repository root:"
      ls -la
      WRAPPER=$(find . -maxdepth 5 -type f -name gradlew -print -quit)
      if [ -z "$WRAPPER" ]; then
        echo "ERROR: gradlew was not found."
        echo "Upload the complete Android project including gradlew and gradle/wrapper/"
        exit 1
      fi
      PROJECT_DIR=$(dirname "$WRAPPER")
      PROJECT_DIR=${PROJECT_DIR#./}
      if [ "$PROJECT_DIR" = "." ]; then
        PROJECT_DIR="."
      fi
      echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      echo "Found wrapper: $WRAPPER"

  - name: Build debug APK
    working-directory: ${{ steps.locate.outputs.project_dir }}
    run: |
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: DateAlbum-debug-apk
      path: "**/build/outputs/apk/debug/*.apk"
      if-no-files-found: error
