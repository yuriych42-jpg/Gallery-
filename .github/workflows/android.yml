name: Build Gallery APK

on:
  push:
    paths:
      - '**'
      - '!README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 2 -type f -name 'Gallery-0.02-project.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)
          fi
          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found in repository."
            exit 1
          fi
          unzip -oq "$ZIP" -d project

      - name: Find Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find project -maxdepth 8 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found in ZIP."
            find project -maxdepth 5 -type f | sort
            exit 1
          fi
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          APK=$(find project -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          mkdir -p output
          cp "$APK" output/Gallery-0.02.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-0.02-APK
          path: output/Gallery-0.02.apk
          if-no-files-found: error
