
name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest project archive
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE=$(find . -maxdepth 1 -type f \
            -name 'Gallery-*-project.zip' \
            | sort -V \
            | tail -n 1)

          if [ -z "$ARCHIVE" ]; then
            echo "No Gallery-*-project.zip archive found in repository root."
            exit 1
          fi

          FILENAME=$(basename "$ARCHIVE")
          VERSION=${FILENAME#Gallery-}
          VERSION=${VERSION%-project.zip}

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Selected archive: $ARCHIVE"
          echo "App version: $VERSION"

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q "${{ steps.project.outputs.archive }}" -d source

          PROJECT_DIR=$(find source -name gradlew -type f \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find gradlew in extracted project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set version
        env:
          APP_VERSION: ${{ steps.project.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          gradle_file = project / "app" / "build.gradle.kts"

          if not gradle_file.exists():
              raise SystemExit(f"Missing file: {gradle_file}")

          text = gradle_file.read_text()

          run_number = int(os.environ["GITHUB_RUN_NUMBER"])

          text, code_count = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {run_number}',
              text,
              count=1
          )

          text, name_count = re.subn(
              r'versionName\s*=\s*"[^"]*"',
              f'versionName = "{os.environ["APP_VERSION"]}"',
              text,
              count=1
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit(
                  "Could not update versionCode/versionName in build.gradle.kts"
              )

          gradle_file.write_text(text)
          print(f"versionCode={run_number}")
          print(f"versionName={os.environ['APP_VERSION']}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        env:
          APP_VERSION: ${{ steps.project.outputs.version }}
        run: |
          mkdir -p output

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          cp "$APK" "output/Gallery-$APP_VERSION.apk"
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-${{ steps.project.outputs.version }}-APK
          path: output/Gallery-${{ steps.project.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30
