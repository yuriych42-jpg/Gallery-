
name: Android CI

on: [push, workflow_dispatch]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Show repository files
        uses: actions/checkout@v4

      - name: Inspect project
        run: |
          echo "Repository files:"
          ls -la
          echo "Gradle files:"
          find . -maxdepth 5 -type f \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print
