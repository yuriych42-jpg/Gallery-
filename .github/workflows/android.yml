name: Build Android APK

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -oq "DateAlbum-Android12-GitHub.zip" -d extracted
          find extracted -maxdepth 5 -type f -name "settings.gradle*" -print

      - name: Find project directory
        id: project
        shell: bash
        run: |
          SETTINGS=$(find extracted -maxdepth 6 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "Android project not found inside ZIP."
            exit 1
          fi
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DateAlbum-debug-apk
          path: "extracted/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
