
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest project archive
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=$(find . -maxdepth 1 -type f \
            -name 'Gallery-*-project.zip' | sort -V | tail -n 1)

          if [ -z "$ARCHIVE" ]; then
            echo "Project archive not found in repository root"
            exit 1
          fi

          VERSION=$(basename "$ARCHIVE" | sed \
            -E 's/^Gallery-(.*)-project\.zip$/\1/')

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Selected: $ARCHIVE, version $VERSION"

      - name: Extract project
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q "${{ steps.project.outputs.archive }}" -d source

          SETTINGS=$(find source -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle(.kts) not found in ZIP"
            find source -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "App Gradle build file not found in $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set version
        env:
          APP_VERSION: ${{ steps.project.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          gradle = root / "app" / "build.gradle.kts"
          if not gradle.exists():
              gradle = root / "app" / "build.gradle"

          content = gradle.read_text()
          content, c1 = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {os.environ["GITHUB_RUN_NUMBER"]}',
              content, count=1
          )
          content, c2 = re.subn(
              r'versionName\s*=\s*"[^"]*"',
              f'versionName = "{os.environ["APP_VERSION"]}"',
              content, count=1
          )

          if c1 != 1 or c2 != 1:
              raise SystemExit("Could not update versionCode/versionName")

          gradle.write_text(content)
          PY

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Prepare APK
        env:
          APP_VERSION: ${{ steps.project.outputs.version }}
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          mkdir -p output
          cp "$APK" "output/Gallery-$APP_VERSION.apk"
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-${{ steps.project.outputs.version }}-APK
          path: output/Gallery-${{ steps.project.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30
